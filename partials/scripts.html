<script>
  // Theme toggle: switches to the opposite of what is currently shown and remembers the choice.
  // Print button: opens the browser print dialog.
  (function () {
    var root = document.documentElement;
    function current() {
      var set = root.getAttribute("data-theme");
      if (set) return set;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function label(btn) {
      var dark = current() === "dark";
      btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      btn.textContent = dark ? "☀" : "☾";
    }
    var toggle = document.querySelector(".theme-toggle");
    if (toggle) {
      label(toggle);
      toggle.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label(toggle);
      });
    }
    var print = document.querySelector(".print-btn");
    if (print) {
      print.addEventListener("click", function (e) { e.preventDefault(); window.print(); });
    }
  })();
</script>
