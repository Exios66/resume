project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!node_modules/**"
    - "!.venv/**"
    - "!.autoresearch-tools/**"
    - "!.autoresearch/**"
  resources:
    - assets/**
    - "!node_modules/**"
    - "!.venv/**"
    - "!.autoresearch-tools/**"
    - "!.autoresearch/**"
    - "!**/node_modules/**"
  post-render: scripts/build/post-render.py

website:
  title: "Jack J. Burleson"
  site-url: "https://exios66.github.io/resume"
  description: "Portfolio of Jack J. Burleson — machine learning, data science, and AI engineering & safety. Document-intelligence pipelines, transformer fine-tuning, LLM evaluation, and behavioral ML."
  favicon: assets/favicon.svg
  search: false
  open-graph:
    locale: en_US
    image: https://exios66.github.io/resume/assets/og-image.png
    image-alt: "Jack J. Burleson — Machine Learning · Data Science · AI Engineering & Safety"
  twitter-card:
    card-style: summary_large_image
    image: https://exios66.github.io/resume/assets/og-image.png

format:
  html:
    theme: none
    css: styles.css
    toc: false
    footnotes-hover: false
    reference-location: document
    page-layout: full
    filters:
      - scripts/filters/charts.lua
      - scripts/filters/site.lua
      - path: scripts/filters/tables.lua
        at: post-render
    title-block-style: none
    minimal: false
    canonical-url: true
    anchor-sections: false
    include-in-header:
      - partials/layout/head.html
    include-before-body:
      - partials/layout/skip-link.html
    include-after-body:
      - partials/layout/scripts.html
