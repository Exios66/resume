project:
  type: website
  output-dir: docs
  resources:
    - assets/**
  post-render: scripts/post-render.py

website:
  title: "Jack J. Burleson"
  site-url: "https://exios66.github.io/resume"
  description: "Portfolio of Jack J. Burleson — AI / machine learning and data science. Document-intelligence pipelines, transformer fine-tuning, LLM evaluation, and behavioral ML."
  favicon: assets/favicon.svg
  search: false
  open-graph:
    locale: en_US
    image: https://exios66.github.io/resume/assets/og-image.png
    image-alt: "Jack J. Burleson — AI / Machine Learning · Data Science"
  twitter-card:
    card-style: summary_large_image
    image: https://exios66.github.io/resume/assets/og-image.png

format:
  html:
    theme: none
    css: styles.css
    toc: false
    page-layout: full
    filters:
      - scripts/site.lua
    title-block-style: none
    minimal: false
    canonical-url: true
    anchor-sections: false
    include-in-header:
      - partials/head.html
    include-before-body:
      - partials/skip-link.html
    include-after-body:
      - partials/scripts.html
